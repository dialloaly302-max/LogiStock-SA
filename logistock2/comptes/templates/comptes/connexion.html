{% extends "base_simple.html" %}

{% block titre %}Connexion{% endblock %}

{% block contenu %}
<div class="carte carte-connexion mx-auto">
    <div class="text-center mb-4">
        <div class="h2 fw-bold mb-1" style="color: var(--couleur-barre);">LogiStock SA</div>
        <div class="text-muted">Connectez-vous pour continuer</div>
    </div>

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="mb-3">
            <label for="identifiant" class="form-label">Identifiant</label>
            <input type="text" id="identifiant" name="identifiant"
                   value="{{ identifiant }}" class="form-control form-control-lg"
                   autocomplete="username" required autofocus>
        </div>

        <div class="mb-4">
            <label for="mot_de_passe" class="form-label">Mot de passe</label>
            <input type="password" id="mot_de_passe" name="mot_de_passe"
                   class="form-control form-control-lg"
                   autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">Se connecter</button>
    </form>
</div>
{% endblock %}
